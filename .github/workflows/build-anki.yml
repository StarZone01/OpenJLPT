name: Build separate Japanese N5 and N4 Anki decks
on:
  push:
    branches: [main]
    paths:
      - "anki_exports/**"
      - "scripts/build_anki.py"
      - ".github/workflows/build-anki.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Anki package builder
        run: pip install genanki
      - name: Build package
        run: python scripts/build_anki.py
      - name: Upload N5 deck
        uses: actions/upload-artifact@v4
        with:
          name: Japanese_JLPT_N5
          path: Japanese_JLPT_N5.apkg
          if-no-files-found: error
          retention-days: 90
      - name: Upload N4 deck
        uses: actions/upload-artifact@v4
        with:
          name: Japanese_JLPT_N4
          path: Japanese_JLPT_N4.apkg
          if-no-files-found: error
          retention-days: 90
